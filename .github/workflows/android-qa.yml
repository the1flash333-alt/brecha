name: BRECHA Android QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot Android 9 / API 28 x86
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect -camera-back none
          script: |
            set -eux
            mkdir -p qa
            adb devices -l | tee qa/adb-devices.txt
            adb shell getprop ro.build.version.release | tee qa/android-version.txt
            adb shell getprop ro.build.version.sdk | tee qa/android-sdk.txt
            adb shell getprop ro.product.cpu.abi | tee qa/android-abi.txt
            adb shell getprop ro.product.model | tee qa/android-model.txt
            adb exec-out screencap -p > qa/android-api28.png
            echo 'BRECHA_ANDROID_EMULATOR_READY=1' | tee qa/status.txt

      - name: Upload Android QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brecha-android-api28-qa
          path: qa/
          if-no-files-found: warn
